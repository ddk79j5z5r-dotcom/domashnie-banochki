<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Запасы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Запасы: химия и уход</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --field: #f3f2ef; --text: #1b1a19; --muted: #6e6c67; --faint: #a3a19b;
    --line: #e7e5e0; --accent: #5b4fe0; --accent-tonal: #eeecfd; --accent-ink: #4035b8; --on-accent: #ffffff;
    --warn: #b9520a; --warn-tonal: #fdf0e3; --danger: #c8323a; --danger-tonal: #fce8e9;
    --shadow: 0 1px 2px rgba(27, 26, 25, .04), 0 2px 10px rgba(27, 26, 25, .05);
    --bar-bg: rgba(250, 249, 247, .84);
    /* цвета категорий: проверенная палитра, порядок важен для различимости */
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
    --r: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0d; --card: #1a1a19; --field: #242422; --text: #f3f2ef; --muted: #a3a19b; --faint: #6b6964;
      --line: #2c2c2a; --accent: #958cff; --accent-tonal: #25224a; --accent-ink: #bdb7ff; --on-accent: #15123a;
      --warn: #f59e4c; --warn-tonal: #3a2512; --danger: #f87171; --danger-tonal: #3b1719;
      --shadow: none; --bar-bg: rgba(20, 20, 19, .84);
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
  button:disabled { opacity: .35; cursor: default; }
  svg { display: block; }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 96px); }

  /* Шапка */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .top h1 { font-size: 32px; line-height: 1.1; letter-spacing: -.02em; margin: 0; font-weight: 800; }
  .top p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .fab { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center; flex: none; box-shadow: var(--shadow); }
  .fab:active { transform: scale(.94); }

  /* Общие блоки */
  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 4px 8px; }
  .muted { color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px;
    border-radius: 12px; font-weight: 600; font-size: 15px; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.tonal { background: var(--accent-tonal); color: var(--accent-ink); }
  .btn.plain { background: var(--field); color: var(--text); }
  .btn.danger { background: var(--danger-tonal); color: var(--danger); }
  .btn.block { width: 100%; min-height: 50px; font-size: 17px; border-radius: 14px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--field); color: var(--muted); flex: none; }

  /* Подсказка для iPhone */
  .banner { display: flex; gap: 12px; align-items: flex-start; background: var(--warn-tonal); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; font-size: 14px; }
  .banner b { display: block; color: var(--warn); font-size: 15px; margin-bottom: 2px; }
  .banner .icon-btn { width: 28px; height: 28px; background: none; margin: -4px -6px 0 auto; }

  /* Блок «Скоро закончится» */
  .soon { background: var(--warn-tonal); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
  .soon h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 15px; color: var(--warn); }
  .soon-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; font-size: 15px; border-top: 1px solid color-mix(in srgb, var(--warn) 15%, transparent); }
  .soon-row:first-of-type { border-top: none; }
  .soon-row span:last-child { color: var(--warn); font-weight: 600; white-space: nowrap; }

  /* Фильтры */
  .search { width: 100%; height: 40px; border-radius: 12px; border: none; background: var(--card); box-shadow: var(--shadow); color: var(--text);
    font: inherit; padding: 0 14px; margin-bottom: 10px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 2px 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 14px; font-weight: 500; color: var(--muted); }
  .chip.on { background: var(--text); color: var(--bg); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Карточка средства */
  .item { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; }
  .item-main { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; }
  .ring { position: relative; width: 56px; height: 56px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: var(--field); }
  .ring .val { stroke: var(--accent); transition: stroke-dashoffset .4s ease; }
  .st-low .ring .val { stroke: var(--warn); }
  .st-empty .ring .val { stroke: var(--danger); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .item-text { flex: 1; min-width: 0; }
  .item-title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { font-size: 14px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub b { color: var(--text); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--accent-tonal); color: var(--accent-ink); }
  .pill.none { background: var(--field); color: var(--muted); font-weight: 500; }
  .pill.low { background: var(--warn-tonal); color: var(--warn); }
  .pill.empty { background: var(--danger-tonal); color: var(--danger); }
  .chev { color: var(--faint); flex: none; }
  .item-actions { display: flex; gap: 8px; margin-top: 12px; }
  .item-actions .btn { flex: 1; }

  .empty-state { text-align: center; padding: 48px 24px; }
  .empty-state .emoji { font-size: 44px; margin-bottom: 8px; }
  .empty-state h2 { font-size: 20px; margin: 0 0 6px; }
  .empty-state p { color: var(--muted); margin: 0 0 18px; }

  /* Нижняя панель вкладок */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
    background: var(--bar-bg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar-inner { display: flex; width: 100%; max-width: 640px; }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; font-size: 11px; font-weight: 500; color: var(--faint); }
  .tabbar button.on { color: var(--accent); }

  /* Нижние окна */
  dialog.sheet { width: 100%; max-width: 560px; max-height: 92vh; margin: auto auto 0; padding: 0; border: none; border-radius: 22px 22px 0 0;
    background: var(--card); color: var(--text); overflow: auto; overscroll-behavior: contain; }
  dialog.sheet[open] { animation: up .28s cubic-bezier(.2, .9, .3, 1); }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, .38); animation: fade .2s; }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  @media (min-width: 600px) { dialog.sheet { margin: auto; border-radius: 22px; } }
  .sheet-in { padding: 8px 20px calc(env(safe-area-inset-bottom) + 20px); }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sheet-head h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .sheet-head small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .sheet-head .icon-btn { width: 32px; height: 32px; border-radius: 50%; }

  /* Формы */
  .field { margin-bottom: 12px; }
  .field > label, .field-label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 6px 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select { width: 100%; height: 48px; padding: 0 14px; font: inherit; font-size: 16px; color: var(--text); background: var(--field);
    border: 1.5px solid transparent; border-radius: 12px; appearance: none; -webkit-appearance: none; }
  input[type=date] { display: block; line-height: 48px; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 19px) 21px, calc(100% - 14px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); background-color: var(--card); }
  .seg { display: flex; background: var(--field); border-radius: 12px; padding: 3px; height: 48px; }
  .seg label { flex: 1; position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: grid; place-items: center; height: 100%; border-radius: 9px; font-size: 15px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .seg input:checked + span { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); font-weight: 600; }
  .divider { height: 1px; background: var(--line); margin: 6px 0 16px; }
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .option { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--field); border-radius: 12px; border: 1.5px solid transparent; cursor: pointer; font-size: 15px; }
  .option input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); appearance: auto; -webkit-appearance: auto; }
  .option:has(input:checked) { border-color: var(--accent); background: var(--accent-tonal); }
  .hint { font-size: 13px; color: var(--muted); margin: -4px 2px 14px; }

  /* Окно списания */
  .big-input { position: relative; margin-bottom: 12px; }
  .big-input input { height: 72px; font-size: 34px; font-weight: 700; text-align: center; padding-right: 60px; padding-left: 60px; }
  .big-input span { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; font-weight: 600; }
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .quick .btn { min-height: 44px; }

  /* Подробности */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .kpi { background: var(--field); border-radius: 14px; padding: 12px; }
  .kpi b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 13px; color: var(--muted); }
  .list { background: var(--field); border-radius: 14px; padding: 2px 14px; margin-bottom: 16px; }
  .list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; font-size: 15px; border-top: 1px solid var(--line); }
  .list-row:first-child { border-top: none; }
  .list-row .r { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .list-row .r.plus { color: var(--accent-ink); }
  .list-row small { display: block; color: var(--muted); font-size: 13px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .stack .btn { min-height: 48px; }
  .list-row button { color: var(--accent); font-size: 15px; font-weight: 500; padding: 4px 0 4px 10px; }
  .list-row button.del { color: var(--danger); }

  /* Статистика */
  .hero { padding: 18px; }
  .hero .label { font-size: 14px; color: var(--muted); }
  .hero .value { font-size: 38px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .hero .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .period { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .period b { font-size: 15px; font-weight: 600; }
  .period .icon-btn { background: var(--card); box-shadow: var(--shadow); color: var(--text); }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 14px; }
  .chart-head h2 { margin: 0; font-size: 17px; }
  .readout { font-size: 14px; color: var(--muted); text-align: right; }
  .readout b { color: var(--text); }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 150px; border-bottom: 1px solid var(--line); }
  .cols button { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .cols button i { display: block; width: 72%; max-width: 26px; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .9; }
  .cols button.sel i { opacity: 1; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--text); }
  .col-labels { display: flex; gap: 2px; margin-top: 6px; }
  .col-labels span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
  .hbar { display: grid; grid-template-columns: minmax(96px, 38%) 1fr auto; gap: 10px; align-items: center; padding: 7px 0; font-size: 15px; }
  .hbar .track { height: 10px; }
  .hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .hbar small { display: block; font-size: 12px; color: var(--muted); }
  .cmp + .cmp { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; }
  .cmp-title { font-weight: 600; margin-bottom: 2px; }
  .best { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-tonal); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 76px); transform: translate(-50%, 8px); z-index: 20;
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 14px; font-size: 15px; font-weight: 500;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 380px) { .quick { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <section id="stockView">
    <header class="top">
      <div><h1>Запасы</h1><p id="summary"></p></div>
      <button class="fab" id="addBtn" aria-label="Добавить средство"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <div id="banner"></div>
    <div id="soon"></div>
    <input id="search" class="search" type="search" placeholder="Поиск" hidden>
    <div id="chips" class="chips" hidden></div>
    <div id="list"></div>
  </section>

  <section id="statsView" hidden></section>

  <section id="moreView" hidden>
    <header class="top"><div><h1>Ещё</h1></div></header>
    <div class="section-title">Категории</div>
    <div class="card" style="padding:2px 16px" id="catList"></div>
    <button class="btn tonal block" id="addCatBtn">Новая категория</button>
    <div class="section-title">Данные</div>
    <div class="card" style="padding:2px 16px">
      <div class="list-row"><span>Сохранить копию в файл<small>Для переноса на другой телефон</small></span><button id="exportBtn">Экспорт</button></div>
      <div class="list-row"><span>Загрузить из файла<small>Заменит текущие данные</small></span><button id="importBtn">Импорт</button></div>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="muted" style="font-size:13px;margin:16px 4px">Данные хранятся только на этом устройстве. Чтобы Safari их не стёр, откройте приложение с ярлыка на экране «Домой».</p>
  </section>
</div>

<nav class="tabbar"><div class="tabbar-inner">
  <button data-tab="stock" class="on">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 3h6v3l1.5 2.2c.3.5.5 1 .5 1.6V19a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9.8c0-.6.2-1.1.5-1.6L9 6V3Z"/><path d="M7 13h10"/></svg>
    Остатки</button>
  <button data-tab="stats">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
    Статистика</button>
  <button data-tab="more">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>
    Ещё</button>
</div></nav>

<dialog class="sheet" id="sheet"><div class="sheet-in">
  <div class="grabber"></div>
  <div class="sheet-head"><h3 id="sheetTitle"></h3>
    <button class="icon-btn" id="sheetClose" aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="sheetBody"></div>
</div></dialog>
<div class="toast" id="toast"></div>

<script>
const KEY = 'chem-inventory-v2';
const SOON_DAYS = 7;        // блок «Скоро закончится»
const REMIND_BEFORE = 5;    // событие в Календаре за N дней до конца
const REMIND_HOUR = 10;
const DAY = 864e5;
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const UNITS = ['мл', 'г', 'шт'];
const ICON = {
  bell: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>',
  chev: '<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>',
  warn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 1.5 21h21L12 2.5Zm-1 7h2v6h-2v-6Zm0 8h2v2h-2v-2Z"/></svg>',
};

let state = load();
const ui = { tab: 'stock', cat: '*', periodEnd: 0, selMonth: null, sheet: null };

// ---------- хранение ----------
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.items)) return withColors({ categories: s.categories || [], catColors: s.catColors || {}, items: s.items });
    const v1 = JSON.parse(localStorage.getItem('chem-inventory-v1'));
    if (v1 && Array.isArray(v1.items)) return migrateV1(v1);
  } catch {}
  return { categories: [], catColors: {}, items: [] };
}
// Цвет закрепляется за категорией при создании и не меняется, даже если другие удалить
function withColors(st) {
  st.categories.forEach(c => { if (!st.catColors[c]) st.catColors[c] = freeSlot(st); });
  return st;
}
function freeSlot(st) {
  const used = new Set(Object.values(st.catColors));
  for (let i = 1; i <= 8; i++) if (!used.has(i)) return i;
  return 0; // больше 8 категорий — нейтральный серый
}
const catColor = c => c && state.catColors[c] ? `var(--c${state.catColors[c]})` : 'var(--faint)';
const catDot = c => `<span class="dot" style="background:${catColor(c)}"></span>`;
function migrateV1(v1) {
  const items = v1.items.map(it => {
    const packs = it.packs.map(p => ({ id: uid(), brand: '', unit: it.unit, amount: p.amount, price: p.price, date: p.date }));
    const last = packs[packs.length - 1];
    packs.slice(0, -1).forEach((p, i) => { p.finishedAt = packs[i + 1].date; p.merged = true; });
    last.carry = packs.slice(0, -1).reduce((s, p) => s + p.amount, 0);
    return { id: it.id, name: it.name, category: it.category || '', createdAt: it.createdAt, packs,
      usages: it.usages.map(u => ({ ...u, packId: last.id })) };
  });
  return withColors({ categories: [...new Set(items.map(i => i.category).filter(Boolean))], catColors: {}, items });
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch { toast('Не удалось сохранить в браузере'); }
}

const fmt = (n, d = 1) => Number((+n).toFixed(d)).toLocaleString('ru-RU');
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const fmtDate = s => new Date(s).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: '2-digit' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayInput = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
// Дата из поля: сегодня — текущий момент, иначе полдень выбранного дня
const fromInput = v => v === todayInput() ? new Date().toISOString() : new Date(v + 'T12:00').toISOString();
const daysBetween = (a, b) => (new Date(b) - new Date(a)) / DAY;
const plural = (n, one, few, many) => { n = Math.abs(Math.round(n)); const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
const dayWord = n => plural(n, 'день', 'дня', 'дней');
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
}

// ---------- расчёты ----------
const curPack = item => item.packs[item.packs.length - 1];

function packState(item) {
  const p = curPack(item);
  const start = p.amount + (p.carry || 0);
  const usages = item.usages.filter(u => u.packId === p.id);
  const used = usages.reduce((s, u) => s + u.amount, 0);
  return { pack: p, start, used, usages, remaining: Math.max(0, start - used) };
}

// Срок жизни законченных упаковок (только тех, что закончились «честно», без переноса остатка)
function lifetimes(item) {
  return item.packs.filter(p => p.finishedAt && !p.merged).map(p => {
    const days = Math.max(1, daysBetween(p.date, p.finishedAt));
    return { brand: p.brand || 'Без названия', unit: p.unit, price: p.price, days,
      size: (p.amount + (p.carry || 0)) / p.amount, perMonth: p.price / days * 30 };
  });
}

// Прогноз: дней до конца текущей упаковки (null — данных нет)
function forecast(item) {
  const { pack, start, remaining, usages } = packState(item);
  if (remaining <= 0) return { days: 0, basis: 'empty' };
  const age = Math.max(0, daysBetween(pack.date, Date.now()));
  let life = lifetimes(item);
  const same = life.filter(l => l.brand === (pack.brand || 'Без названия') && l.unit === pack.unit);
  if (same.length) life = same;

  if (life.length) {
    // скорость в «упаковках в день» по прошлым упаковкам
    const ppd = life.reduce((s, l) => s + l.size / l.days, 0) / life.length;
    const byAge = start / pack.amount - age * ppd;
    const byEntries = remaining / pack.amount;
    // свежие списания уточняют прогноз: если они показывают меньший остаток — верим им
    const frac = usages.length ? Math.min(byAge, byEntries) : byAge;
    return { days: Math.max(0, frac / ppd), basis: 'life' };
  }
  if (!usages.length) return null;
  const used = start - remaining;
  const rate = used / Math.max(1, age);
  return { days: remaining / rate, basis: 'rate' };
}

function status(item) {
  const { remaining } = packState(item);
  if (remaining <= 0) return 'empty';
  const f = forecast(item);
  return f && f.days < SOON_DAYS ? 'low' : '';
}

function forecastShort(f) {
  if (!f) return 'нет прогноза';
  if (f.basis === 'empty') return 'закончилось';
  if (f.days < 0.5) return 'пора покупать';
  const d = Math.round(f.days);
  return `≈ ${d} ${dayWord(d)}`;
}

        <div class="readout">${sel ? `${sel.label} ${sel.year}: <b>${rub(sel.sum)}</b>` : 'нажмите на столбик'}</div></div>

          aria-label="${m.label} ${m.year}: ${rub(m.sum)}"><i style="height:${(m.sum / max * 100).toFixed(1)}%"></i></button>`).join('')}</div>
      <div class="col-labels">${months.map(m => `<span>${m.label}</span>`).join('')}</div>
    </div>
    <div class="card">
      <div class="chart-head"><h2>По категориям</h2></div>
      ${cats.length ? cats.map(([c, v]) => `<div class="hbar"><span>${esc(c)}</span>
        <span class="track"><i style="width:${(v / catMax * 100).toFixed(1)}%;background:${catColor(c === 'Без категории' ? '' : c)}"></i></span><span class="v">${rub(v)}</span></div>`).join('')
        : '<div class="muted">Покупок за период нет</div>'}
    </div>
    <div class="card">
      <div class="chart-head"><h2>Что выгоднее</h2><div class="readout">₽ в месяц</div></div>
      ${cmp.length ? cmp.map(({ it, rows }) => {
        const m = Math.max(...rows.map(r => r.perMonth), 1);
        return `<div class="cmp"><div class="cmp-title">${esc(it.name)}</div>
        ${rows.map((r, i) => `<div class="hbar"><span>${esc(r.k)}${i === 0 && rows.length > 1 ? '<span class="best">выгоднее</span>' : ''}
            <small>${rub(r.price)} · ~${Math.round(r.days)} ${dayWord(r.days)}${r.n > 1 ? ' · ' + r.n + ' уп.' : ''}</small></span>
          <span class="track"><i style="width:${(r.perMonth / m * 100).toFixed(1)}%"></i></span><span class="v">${rub(r.perMonth)}</span></div>`).join('')}</div>`;
      }).join('') : '<div class="muted">Появится, когда закончится хотя бы одна упаковка: «Купил новую» → «Да, закончилась».</div>'}
    </div>`;
}

function renderMore() {
  document.getElementById('catList').innerHTML = state.categories.length
    ? state.categories.map((c, i) => {
        const cnt = state.items.filter(it => it.category === c).length;
        return `<div class="list-row"><span>${catDot(c)}${esc(c)}<small>${cnt} ${plural(cnt, 'средство', 'средства', 'средств')}</small></span>
          <span><button data-cat-rename="${i}">Изменить</button><button class="del" data-cat-del="${i}">Удалить</button></span></div>`;
      }).join('')
    : '<div class="list-row muted">Категорий пока нет</div>';
}

function render() {
  if (ui.tab === 'stock') renderStock();
  else if (ui.tab === 'stats') renderStats();
  else renderMore();
}

// ---------- действия ----------
function useAmount(item, amount) {
  if (!(amount > 0)) return toast('Введите количество больше нуля');
  const ps = packState(item);
  if (amount > ps.remaining + 1e-9) {
    if (!confirm(`Остаток ${fmt(ps.remaining)} ${ps.pack.unit}, а вы списываете ${fmt(amount)}. Списать весь остаток?`)) return;
    amount = ps.remaining;
  }
  item.usages.push({ id: uid(), date: new Date().toISOString(), amount, packId: ps.pack.id });
  save(); closeSheet(); render();
  toast(`Списано ${fmt(amount)} ${ps.pack.unit} · осталось ${fmt(packState(item).remaining)}`);
}

function buy(item, form) {
  const amount = num(form.amount.value), price = num(form.price.value);
  if (!(amount > 0) || !(price >= 0)) return toast('Проверьте объём и цену');
  const ps = packState(item), old = ps.pack, date = fromInput(form.date.value);
  if (new Date(date) < new Date(old.date)) return toast('Дата раньше предыдущей покупки');
  const unit = form.unit.value;
  const choice = ps.remaining > 0 ? (form.old.value || 'finished') : 'finished';
  const pack = { id: uid(), brand: form.brand.value.trim(), unit, amount, price, date };
  old.finishedAt = date;
  if (choice === 'left' && unit === old.unit) {
    old.merged = true;
    pack.carry = ps.remaining;
  } else if (ps.remaining > 0) {
    item.usages.push({ id: uid(), date, amount: ps.remaining, packId: old.id, writeoff: true });
  }
  item.packs.push(pack);
  save(); closeSheet(); render(); toast('Покупка сохранена');
}

function unbuy(item) {
  if (item.packs.length < 2) return false;
  const last = curPack(item);
  if (!confirm(`Отменить покупку «${last.brand || 'Без названия'}» от ${fmtDate(last.date)}? Списания по ней тоже удалятся.`)) return false;
  item.packs.pop();
  const prev = curPack(item);
  item.usages = item.usages.filter(u => u.packId !== last.id && !(u.packId === prev.id && u.writeoff));
  delete prev.finishedAt; delete prev.merged;
  save(); return true;
}

function undoUse(item) {
  const ps = packState(item);
  const u = [...ps.usages].reverse().find(x => !x.writeoff);
  if (!u) return;
  item.usages = item.usages.filter(x => x !== u);
  save(); toast(`Отменено списание ${fmt(u.amount)} ${ps.pack.unit}`);
}

// Событие для Календаря iPhone (.ics)
function remind(item) {
  const f = forecast(item);
  if (!f) return toast('Пока нет данных для прогноза — внесите расход');
  const d = new Date(Date.now() + (f.days - REMIND_BEFORE) * DAY);
  d.setHours(REMIND_HOUR, 0, 0, 0);
  if (d < new Date()) { d.setTime(Date.now()); d.setHours(REMIND_HOUR, 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); }
  const pad = n => String(n).padStart(2, '0');
  const local = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const icsText = s => String(s).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const brand = curPack(item).brand;
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//zapasy//RU', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `UID:${uid()}@himiya`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART:${local(d)}`, 'DURATION:PT15M',
    `SUMMARY:${icsText('Купить: ' + item.name + (brand ? ' (' + brand + ')' : ''))}`,
    `DESCRIPTION:${icsText('По прогнозу закончится примерно через ' + REMIND_BEFORE + ' дней.')}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Пора докупить', 'TRIGGER:PT0M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const file = new File([ics], 'kupit.ics', { type: 'text/calendar' });
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = 'kupit.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast(`Напоминание на ${d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}, ${REMIND_HOUR}:00`);
}

// ---------- обработчики ----------
document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => {
  ui.tab = b.dataset.tab;
  document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x === b));
  ['stock', 'stats', 'more'].forEach(t => document.getElementById(t + 'View').hidden = ui.tab !== t);
  window.scrollTo(0, 0);
  render();
});

document.getElementById('addBtn').onclick = sheetAdd;
document.getElementById('search').addEventListener('input', renderStock);
document.getElementById('chips').addEventListener('click', e => {
  const c = e.target.closest('[data-cat]'); if (!c) return;
  ui.cat = c.dataset.cat; renderStock();
});

document.getElementById('list').addEventListener('click', e => {
  if (e.target.closest('[data-empty-add]')) return sheetAdd();
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const item = findItem(btn.closest('[data-id]').dataset.id);
  ({ details: sheetDetails, use: sheetUse, buy: sheetBuy, remind })[btn.dataset.act](item);
});

// Всё, что внутри нижнего окна
const body = document.getElementById('sheetBody');
body.addEventListener('change', e => {
  if (!e.target.classList.contains('cat-select') || e.target.value !== '__new') return;
  const name = addCategory(), sel = e.target;
  sel.innerHTML = catOptions(name || '');
  sel.value = name || '';
});
body.addEventListener('click', e => {
  const ctx = ui.sheet; if (!ctx) return;
  const item = ctx.id && findItem(ctx.id);
  const q = e.target.closest('[data-quick]');
  if (q) { body.querySelector('[name=amount]').value = q.dataset.quick; return; }
  const d = e.target.closest('[data-do]'); if (!d) return;
  switch (d.dataset.do) {
    case 'remind': remind(item); break;
    case 'undo': undoUse(item); render(); sheetDetails(item); break;
    case 'unbuy': if (unbuy(item)) { render(); sheetDetails(item); } break;
    case 'delete':
      if (confirm(`Удалить «${item.name}» вместе со всей историей?`)) {
        state.items = state.items.filter(i => i !== item); save(); closeSheet(); render();
      }
      break;
  }
});
body.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, ctx = ui.sheet, item = ctx.id && findItem(ctx.id);
  if (f.id === 'useForm') useAmount(item, num(f.amount.value));
  if (f.id === 'buyForm') buy(item, f);
  if (f.id === 'editForm') {
    item.name = f.name.value.trim() || item.name;
    item.category = f.cat.value === '__new' ? '' : f.cat.value;
    save(); render(); sheetDetails(item); toast('Сохранено');
  }
  if (f.id === 'addForm') {
    const name = f.name.value.trim(), amount = num(f.amount.value), price = num(f.price.value);
    if (!name || !(amount > 0) || !(price >= 0)) return toast('Проверьте поля');
    state.items.push({
      id: uid(), name, category: f.cat.value === '__new' ? '' : f.cat.value, createdAt: new Date().toISOString(), usages: [],
      packs: [{ id: uid(), brand: f.brand.value.trim(), unit: f.unit.value, amount, price, date: fromInput(f.date.value) }]
    });
    save(); closeSheet(); render(); toast('Добавлено: ' + name);
  }
});

document.getElementById('statsView').addEventListener('click', e => {
  const m = e.target.closest('[data-month]'), p = e.target.closest('[data-period]');
  if (m) { const k = +m.dataset.month; ui.selMonth = ui.selMonth === k ? null : k; renderStats(); }
  if (p) { ui.periodEnd += +p.dataset.period; ui.selMonth = null; renderStats(); }
});

document.getElementById('addCatBtn').onclick = () => { addCategory(); renderMore(); };
document.getElementById('catList').addEventListener('click', e => {
  const r = e.target.dataset.catRename, d = e.target.dataset.catDel;
  if (r !== undefined) {
    const old = state.categories[r], n = (prompt('Новое название:', old) || '').trim();
    if (!n || n === old) return;
    state.categories[r] = n;
    state.catColors[n] = state.catColors[old]; delete state.catColors[old];
    state.items.forEach(it => { if (it.category === old) it.category = n; });
  } else if (d !== undefined) {
    const c = state.categories[d];
    const cnt = state.items.filter(it => it.category === c).length;
    if (!confirm(`Удалить категорию «${c}»?${cnt ? ` ${cnt} ${plural(cnt, 'средство останется', 'средства останутся', 'средств останутся')} без категории.` : ''}`)) return;
    state.categories.splice(d, 1);
    delete state.catColors[c];
    state.items.forEach(it => { if (it.category === c) it.category = ''; });
  } else return;
  save(); renderMore();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `himiya-${todayInput()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.items)) throw 0;
    if (!confirm(`Заменить текущие данные (${state.items.length}) данными из файла (${data.items.length})?`)) return;
    state = withColors({ categories: data.categories || [], catColors: data.catColors || {}, items: data.items });
    save(); render(); toast('Импорт выполнен');
  } catch { toast('Файл не подходит'); }
  e.target.value = '';
});

renderBanner();
render();
</script>
</body>
</html>
